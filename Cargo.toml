[workspace]
default-members = [ "examples/story" ]
members = [
  "crates/gpui-storybook",
  "crates/gpui-storybook-core",
  "crates/gpui-storybook-automation",
  "crates/gpui-storybook-automation-gpui",
  "crates/gpui-storybook-mobile",
  "crates/gpui-storybook-mobile-host",
  "crates/gpui-storybook-macros",
  "crates/gpui-storybook-mcp",
  "crates/gpui-storybook-launch",
  "crates/gpui-storybook-preferences",
  "crates/gpui-storybook-test",
  "crates/gpui-storybook-toml",
  "examples/story",
  "examples/component",
  "examples/embedded",
  "examples/mobile",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-storybook"
rust-version = "1.99"
# Publish the coordinated automation API extraction at the incompatible 0.8.0
# boundary. Maintained Android support retains the current version until release.
version = "0.7.1"

[workspace.dependencies]
adbutils = { default-features = false, package = "adbutils-rs", version = "=0.1.0" }
anyhow = "1.0"
base64 = "0.23"
bon = "3.10"
clap = "4.6"
component-shape-mcp = "0.3.4"
console_error_panic_hook = "0.1"
darling = "0.24"
derive_more = "2.1"
dioxus = { default-features = false, version = "0.7" }
es-fluent = "0.21.0"
es-fluent-build = "0.21.0"
es-fluent-lang = "0.21.0"
es-fluent-manager-core = "0.21.0"
es-fluent-manager-embedded = "0.21.0"
fluent-langneg = "=0.14.2"
frame-capture = "0.2.3"
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui-es-fluent = "0.3.0"
gpui-kit = "0.7.0"
gpui-mobile = { default-features = false, git = "https://github.com/longbridge/gpui-mobile", package = "gpui-pre-mobile", rev = "9075e3aa3eea812127f2c60ed66f0cd5798ff245" }
gpui-storybook = { path = "crates/gpui-storybook", version = "0.7.1" }
gpui-storybook-automation = { path = "crates/gpui-storybook-automation", version = "0.7.1" }
gpui-storybook-automation-gpui = { path = "crates/gpui-storybook-automation-gpui", version = "0.7.1" }
gpui-storybook-core = { path = "crates/gpui-storybook-core", version = "0.7.1" }
gpui-storybook-launch = { path = "crates/gpui-storybook-launch", version = "0.7.1" }
gpui-storybook-macros = { path = "crates/gpui-storybook-macros", version = "0.7.1" }
gpui-storybook-mcp = { path = "crates/gpui-storybook-mcp", version = "0.7.1" }
gpui-storybook-mobile = { path = "crates/gpui-storybook-mobile", version = "0.7.1" }
gpui-storybook-preferences = { path = "crates/gpui-storybook-preferences", version = "0.7.1" }
gpui-storybook-test = { path = "crates/gpui-storybook-test", version = "0.7.1" }
gpui-storybook-toml = { path = "crates/gpui-storybook-toml", version = "0.7.1" }
gpui_platform = { features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], package = "gpui-pre-platform", version = "=0.3.7" }
gpui_wgpu = { features = [ "font-kit" ], package = "gpui-pre-wgpu", version = "=0.3.7" }
heck = "0.5"
image = { default-features = false, features = [ "png" ], version = "0.25" }
insta = "1.49"
inventory = "0.3"
itertools = "0.15"
koruma = "0.13.0"
libc = "0.2"
loom = "0.7"
prettyplease = "0.3"
proc-macro2 = "1.0"
proptest = { default-features = false, features = [ "std" ], version = "1.11" }
quote = "1.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
rmcp = "3.5.0"
rust-embed = "8.12"
schemars = "1.2.2"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "d9c54bbb850b58b822458a6a15eb75ba64034a31" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "d9c54bbb850b58b822458a6a15eb75ba64034a31" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "d9c54bbb850b58b822458a6a15eb75ba64034a31" }
strum = "0.28"
syn = "3.0"
sys-locale = "=0.3.2"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
tokio-util = "0.7.19"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
ttf-parser = "0.25"
unic-langid = "0.9"
unicode-segmentation = "1.13"
url = "2.5"
wasm-bindgen = "0.2"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3" }

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.mobile]
debug-assertions = false
inherits = "dev"
overflow-checks = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
