[workspace]
default-members = [ "examples/story" ]
members = [
  "crates/gpui-storybook",
  "crates/gpui-storybook-core",
  "crates/gpui-storybook-macros",
  "crates/gpui-storybook-mcp",
  "crates/gpui-storybook-launch",
  "crates/gpui-storybook-preferences",
  "crates/gpui-storybook-test",
  "crates/gpui-storybook-toml",
  "examples/story",
  "examples/component",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-storybook"
rust-version = "1.98"
version = "0.6.2"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = "4.6"
console_error_panic_hook = "0.1"
component-shape-mcp = "0.3.2"
darling = "0.24"
derive_more = "2.1"
dioxus = { default-features = false, version = "0.7" }
es-fluent = "0.20.3"
es-fluent-build = "0.20.3"
es-fluent-lang = "0.20.3"
es-fluent-manager-core = "0.20.3"
es-fluent-manager-embedded = "0.20.3"
fluent-langneg = "=0.14.2"
frame-capture = "0.2.1"
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui-kit = "0.6.6"
gpui-es-fluent = "0.2.2"
gpui-storybook = { path = "crates/gpui-storybook", version = "0.6.2" }
gpui-storybook-core = { path = "crates/gpui-storybook-core", version = "0.6.2" }
gpui-storybook-launch = { path = "crates/gpui-storybook-launch", version = "0.6.2" }
gpui-storybook-macros = { path = "crates/gpui-storybook-macros", version = "0.6.2" }
gpui-storybook-mcp = { path = "crates/gpui-storybook-mcp", version = "0.6.2" }
gpui-storybook-preferences = { path = "crates/gpui-storybook-preferences", version = "0.6.2" }
gpui-storybook-test = { path = "crates/gpui-storybook-test", version = "0.6.2" }
gpui-storybook-toml = { path = "crates/gpui-storybook-toml", version = "0.6.2" }
gpui_platform = { features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
], package = "gpui-pre-platform", version = "=0.3.6" }
gpui_wgpu = { package = "gpui-pre-wgpu", features = [ "font-kit" ], version = "=0.3.6" }
heck = "0.5"
image = { default-features = false, features = [ "png" ], version = "0.25" }
insta = "1.48"
inventory = "0.3"
itertools = "0.15"
koruma = "0.12.2"
libc = "0.2"
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.6" }
rmcp = "3.4.1"
rust-embed = "8.12"
schemars = "1.2.2"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "14df45a56f8fa847f816cf297c7b36dffb77ea1e" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "14df45a56f8fa847f816cf297c7b36dffb77ea1e" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "14df45a56f8fa847f816cf297c7b36dffb77ea1e" }
strum = "0.28"
syn = "3.0"
sys-locale = "=0.3.2"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
ttf-parser = "0.25"
unic-langid = "0.9"
unicode-segmentation = "1.13"
url = "2.5"
wasm-bindgen = "0.2"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3" }

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
