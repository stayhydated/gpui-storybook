[workspace]
default-members = [ "examples/story" ]
members = [
  "crates/gpui-storybook",
  "crates/gpui-storybook-core",
  "crates/gpui-storybook-macros",
  "crates/gpui-storybook-mcp",
  "crates/gpui-storybook-launch",
  "crates/gpui-storybook-preferences",
  "crates/gpui-storybook-test",
  "crates/gpui-storybook-toml",
  "examples/story",
  "examples/component",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-storybook"
rust-version = "1.99"
version = "0.7.1"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = "4.6.7"
component-shape-mcp = "0.3.4"
console_error_panic_hook = "0.1.7"
darling = "0.24.1"
derive_more = "2.1.1"
dioxus = { default-features = false, version = "0.7.10" }
es-fluent = "0.21.0"
es-fluent-build = "0.21.0"
es-fluent-lang = "0.21.0"
es-fluent-manager-core = "0.21.0"
es-fluent-manager-embedded = "0.21.0"
fluent-langneg = "=0.14.2"
frame-capture = "0.2.3"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-es-fluent = "0.3.0"
gpui-kit = "0.7.3"
gpui-storybook = { path = "crates/gpui-storybook", version = "0.7.1" }
gpui-storybook-core = { path = "crates/gpui-storybook-core", version = "0.7.1" }
gpui-storybook-launch = { path = "crates/gpui-storybook-launch", version = "0.7.1" }
gpui-storybook-macros = { path = "crates/gpui-storybook-macros", version = "0.7.1" }
gpui-storybook-mcp = { path = "crates/gpui-storybook-mcp", version = "0.7.1" }
gpui-storybook-preferences = { path = "crates/gpui-storybook-preferences", version = "0.7.1" }
gpui-storybook-test = { path = "crates/gpui-storybook-test", version = "0.7.1" }
gpui-storybook-toml = { path = "crates/gpui-storybook-toml", version = "0.7.1" }
gpui_platform = { features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], package = "gpui-pre-platform", version = "=0.3.9" }
gpui_wgpu = { features = [ "font-kit" ], package = "gpui-pre-wgpu", version = "=0.3.9" }
heck = "0.5.0"
image = { default-features = false, features = [ "png" ], version = "0.25.10" }
insta = "1.49.0"
inventory = "0.3.25"
itertools = "0.15.0"
koruma = "0.13.0"
libc = "0.2.190"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
read-fonts = "0.45.0"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.9" }
rmcp = "3.5.1"
rust-embed = "8.13.0"
schemars = "1.2.3"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "3136b369bb54312096ad83ba74735aab29109835" }
strum = "0.28.0"
syn = "3.0.9"
sys-locale = "=0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unic-langid = "0.9.6"
unicode-segmentation = "1.13.3"
url = "2.5.8"
wasm-bindgen = "0.2.129"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3.106" }

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
