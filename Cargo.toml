[workspace]
default-members = [ "examples/story" ]
members = [
  "crates/gpui-storybook",
  "crates/gpui-storybook-components",
  "crates/gpui-storybook-core",
  "crates/gpui-storybook-macros",
  "crates/gpui-storybook-mcp",
  "crates/gpui-storybook-launch",
  "crates/gpui-storybook-preferences",
  "crates/gpui-storybook-toml",
  "examples/story",
  "examples/component",
  "web",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
readme = "README.md"
repository = "https://github.com/stayhydated/gpui-storybook"
rust-version = "1.98"
version = "0.5.0"

[workspace.dependencies]
anyhow = "1.0"
clap = "4.6"
component-shape-mcp = { git = "https://github.com/stayhydated/component-shape", rev = "21a910f5eabf68a74195915e6dcc88d59d85c061", version = "0.2.0" }
darling = "0.24"
derive_more = "2.1"
dioxus = { default-features = false, version = "0.7" }
es-fluent = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-build = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-lang = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-manager-core = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
es-fluent-manager-embedded = { git = "https://github.com/stayhydated/es-fluent", rev = "1b65a06860da8a08282220b92d69ad30ae6664f1", version = "0.18.1" }
fluent-langneg = "=0.13.1"
frame-capture = { git = "https://github.com/stayhydated/frame-capture", rev = "279f2bf288a340e4862157b50c06395a7e4dd389", version = "0.1.0" }
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.2.2" }
gpui-component = { git = "https://github.com/stayhydated/gpui-component", rev = "fc7ea7a1a56daa54cfe48b0bcb688493eaff198b" }
gpui-component-assets = { git = "https://github.com/stayhydated/gpui-component", rev = "fc7ea7a1a56daa54cfe48b0bcb688493eaff198b" }
gpui-es-fluent = { git = "https://github.com/stayhydated/gpui-es-fluent", rev = "012464ce5c1aa98212b562d585ae509795d517c9", version = "0.1.0" }
gpui-storybook = { path = "crates/gpui-storybook", version = "0.5.0" }
gpui-storybook-components = { path = "crates/gpui-storybook-components", version = "0.5.0" }
gpui-storybook-core = { path = "crates/gpui-storybook-core", version = "0.5.0" }
gpui-storybook-launch = { path = "crates/gpui-storybook-launch", version = "0.5.0" }
gpui-storybook-macros = { path = "crates/gpui-storybook-macros", version = "0.5.0" }
gpui-storybook-mcp = { path = "crates/gpui-storybook-mcp", version = "0.5.0" }
gpui-storybook-preferences = { path = "crates/gpui-storybook-preferences", version = "0.5.0" }
gpui-storybook-toml = { path = "crates/gpui-storybook-toml", version = "0.5.0" }
gpui_platform = { branch = "linux-headless-renderer", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
], git = "https://github.com/stayhydated/zed" }
gpui_tokio = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
heck = "0.5"
image = { default-features = false, features = [ "png" ], version = "0.25" }
insta = "1.48"
inventory = "0.3"
itertools = "0.15"
koruma = { git = "https://github.com/stayhydated/koruma", rev = "f86973a86d7260a3589e9070ec5e44000eafa61c", version = "0.11.0" }
libc = "0.2"
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
reqwest_client = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
rmcp = "3.1"
rust-embed = "8.12"
schemars = "1.2.2"
serde = "1.0"
serde_json = "1.0"
stayhydated-dioxus = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-site = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
stayhydated-xtask = { git = "https://github.com/stayhydated/shared", rev = "74aec628e81fc4cc04b2f34ef22c63ba95847334" }
strum = "0.28"
syn = "3.0"
sys-locale = "=0.3.2"
tempfile = "3.27"
thiserror = "2.0"
tokio = "1.53"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
unic-langid = "0.9"
unicode-segmentation = "1.13"
url = "2.5"
wasm-bindgen = "0.2"
web = { path = "web" }
web-sys = { features = [ "Location", "Window" ], version = "0.3" }

[patch."https://github.com/zed-industries/zed"]
gpui = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "=0.2.2" }
gpui_macros = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed", version = "0.1.0" }
gpui_platform = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }
reqwest_client = { branch = "linux-headless-renderer", git = "https://github.com/stayhydated/zed" }

[workspace.lints.rust]
future_incompatible = "deny"
nonstandard_style = "deny"
unexpected_cfgs = { check-cfg = [ "cfg(coverage)" ], level = "deny" }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
derive_partial_eq_without_eq = "warn"
err_expect = "warn"
incompatible_msrv = "deny"
iter_on_single_items = "warn"
needless_bool = "warn"
redundant_clone = "warn"
todo = "deny"
type_complexity = "allow"
uninlined_format_args = "allow"
unused_trait_names = "warn"
useless_conversion = "warn"

[profile.dev]
codegen-units = 16
debug = "limited"
opt-level = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
