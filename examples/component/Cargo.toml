[package]
name = "gpui-storybook-example-component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Unlicense"
publish = false

[features]
default = [  ]
inspector = [ "gpui-storybook/inspector" ]
mcp = [ "gpui-storybook/mcp" ]
performance = [ "gpui-storybook/performance" ]

[dependencies]
es-fluent = { workspace = true }
es-fluent-lang = { workspace = true }
es-fluent-manager-embedded = { workspace = true }
gpui-kit = { workspace = true }
gpui-es-fluent = { workspace = true }
gpui-storybook = { workspace = true }
reqwest_client = { workspace = true }
rust-embed = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { features = [ "env-filter" ], workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[dev-dependencies]
gpui-kit = { features = [ "test-support" ], workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = [ "rust-embed" ]
