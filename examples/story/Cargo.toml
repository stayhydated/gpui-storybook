[package]
name = "gpui-storybook-example-story"
version.workspace = true
edition.workspace = true
license = "Unlicense"
publish = false
autobins = false
autolib = false

[[bin]]
name = "gpui-storybook-example-story"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[features]
default = [  ]
dock = [ "gpui-storybook/dock" ]
inspector = [ "gpui-storybook/inspector" ]
mcp = [ "gpui-storybook/mcp" ]

[dependencies]
es-fluent = { workspace = true }
es-fluent-lang = { workspace = true }
es-fluent-manager-embedded = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-es-fluent = { workspace = true }
gpui_platform = { workspace = true }
gpui-storybook = { workspace = true }
rust-embed = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest_client = { workspace = true }
tracing-subscriber = { features = [ "env-filter" ], workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = [ "rust-embed" ]
