[package]
name = "gpui-storybook-core"
description = """
Core crate for gpui-storybook
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
include = [ "src/**/*", "assets/**/*", "i18n.toml" ]

[package.metadata.cargo-machete]
ignored = [ "gpui_platform" ]

[features]
capture = [ "dep:gpui_platform", "dep:image", "gpui-kit/test-support", "gpui_platform/test-support" ]
inspector = [ "gpui-kit/inspector" ]
performance = [ "dep:gpui-core", "gpui-core/profiler" ]

[dependencies]
anyhow = { workspace = true }
derive_more = { features = [ "as_ref", "display", "from" ], workspace = true }
es-fluent = { workspace = true }
es-fluent-manager-core = { workspace = true }
es-fluent-manager-embedded = { workspace = true }
gpui-core = { optional = true, workspace = true }
gpui-kit = { workspace = true }
gpui-es-fluent = { workspace = true }
gpui-storybook-components = { workspace = true }
gpui-storybook-preferences = { workspace = true }
gpui_platform = { optional = true, workspace = true }
image = { optional = true, workspace = true }
inventory = { workspace = true }
koruma = { workspace = true }
rust-embed = { features = [ "include-exclude", "interpolate-folder-path" ], workspace = true }
schemars = { workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { features = [ "sync" ], workspace = true }
tracing = { workspace = true }
unic-langid = { features = [ "serde" ], workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

[target.'cfg(target_family = "wasm")'.dependencies]
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_tokio = { workspace = true }

[build-dependencies]
es-fluent-build = { workspace = true }

[dev-dependencies]
gpui-kit = { features = [ "test-support" ], workspace = true }
strum.workspace = true
tempfile.workspace = true
tokio = { features = [ "rt" ], workspace = true }

[lints]
workspace = true
