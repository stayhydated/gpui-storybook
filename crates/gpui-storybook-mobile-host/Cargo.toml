[package]
name = "gpui-storybook-mobile-host"
description = "ADB attach and MCP host for embedded Storybook device automation"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
adbutils = { workspace = true }
bon = { workspace = true }
clap = { features = [ "derive" ], workspace = true }
gpui-storybook-automation = { workspace = true }
gpui-storybook-mcp = { workspace = true }
gpui-storybook-mobile = { workspace = true }
image = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { features = [ "rt-multi-thread", "time", "net", "io-util", "fs" ], workspace = true }
tokio-util = { features = [ "rt" ], workspace = true }
tracing = { workspace = true }
tracing-subscriber = { features = [ "env-filter" ], workspace = true }

[dev-dependencies]
tokio = { features = [ "macros", "test-util" ], workspace = true }

[lints]
workspace = true
