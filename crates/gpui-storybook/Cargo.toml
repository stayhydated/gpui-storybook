[package]
name = "gpui-storybook"
description = """
The gpui-storybook crate
"""
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = [ "macros" ]
inspector = [ "gpui-storybook-core/inspector" ]
macros = [ "dep:gpui-storybook-macros" ]
mcp = [ "dep:gpui-storybook-mcp" ]
performance = [ "gpui-storybook-core/performance" ]

[dependencies]
gpui-kit = { workspace = true }
gpui-es-fluent = { workspace = true }
gpui-storybook-core = { workspace = true }
gpui-storybook-macros = { optional = true, workspace = true }
gpui-storybook-preferences = { workspace = true }
gpui-storybook-toml = { workspace = true }
inventory = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unic-langid = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_tokio = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gpui-storybook-mcp = { optional = true, workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
es-fluent = { workspace = true }
gpui-kit = { features = [ "test-support" ], workspace = true }
strum = { workspace = true }

[lints]
workspace = true
