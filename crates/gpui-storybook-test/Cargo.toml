[package]
name = "gpui-storybook-test"
description = "Headless portable-story, visual-baseline, and capture-matrix tooling for GPUI Storybook"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"

[features]
capture = [ "gpui-storybook-core/capture" ]
default = [ "capture" ]
performance = [ "gpui/profiler" ]

[dependencies]
anyhow = { workspace = true }
gpui = { features = [ "test-support" ], workspace = true }
gpui-component = { workspace = true }
gpui-storybook-core = { workspace = true }
gpui_platform = { features = [
  "font-kit",
  "runtime_shaders",
  "test-support",
  "wayland",
  "x11",
], workspace = true }
gpui_wgpu = { features = [ "font-kit", "test-support" ], workspace = true }
image = { workspace = true }
inventory = { workspace = true }
serde = { features = [ "derive" ], workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
