name: ci

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: true
  RUSTC_WRAPPER: sccache

jobs:
  es-fluent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Check FTL files
        uses: stayhydated/es-fluent/crates/es-fluent-cli@master
        with:
          path: .
          all: true

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          sway: true

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Smoke test Storybook capture through headless Sway
        if: runner.os == 'Linux'
        shell: bash
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY -u WAYLAND_SOCKET -u ZED_HEADLESS \
            RUST_LOG=warn \
            WGPU_CAPTURE_ROUTE=gpui-storybook-example-story-ButtonStory \
            WGPU_CAPTURE_PATH=target/storybook-captures/ci-sway-button.png \
            WGPU_CAPTURE_WIDTH=390 \
            WGPU_CAPTURE_HEIGHT=844 \
            timeout 90s sh -c '
              storybook_runtime_dir=$(mktemp -d) || exit 1
              chmod 700 "$storybook_runtime_dir"
              export XDG_RUNTIME_DIR="$storybook_runtime_dir"
              unset I3SOCK SWAYSOCK
              storybook_sway_config="$storybook_runtime_dir/sway.conf"
              storybook_sway_log="$storybook_runtime_dir/sway.log"
              printf "%s\n" \
                "output * mode 1920x1200" \
                "seat seat0 fallback true" \
                "for_window [app_id=\".*\"] floating enable" \
                > "$storybook_sway_config"
              WLR_BACKENDS=headless \
              WLR_HEADLESS_OUTPUTS=1 \
              WLR_LIBINPUT_NO_DEVICES=1 \
              WLR_RENDERER=gles2 \
              WLR_RENDERER_ALLOW_SOFTWARE=1 \
              LIBGL_ALWAYS_SOFTWARE=1 \
              sway --unsupported-gpu --config "$storybook_sway_config" \
                > "$storybook_sway_log" 2>&1 &
              storybook_sway_pid=$!
              storybook_cleanup() {
                kill "$storybook_sway_pid" 2>/dev/null || true
                wait "$storybook_sway_pid" 2>/dev/null || true
                rm -rf "$storybook_runtime_dir"
              }
              trap storybook_cleanup EXIT
              storybook_wayland_socket=
              storybook_sway_attempts=0
              while [ -z "$storybook_wayland_socket" ]; do
                for storybook_socket_candidate in "$XDG_RUNTIME_DIR"/wayland-*; do
                  if [ -S "$storybook_socket_candidate" ]; then
                    storybook_wayland_socket=$storybook_socket_candidate
                    break
                  fi
                done
                if ! kill -0 "$storybook_sway_pid" 2>/dev/null; then
                  if [ -f "$storybook_sway_log" ]; then
                    cat "$storybook_sway_log" >&2
                  fi
                  echo "gpui-storybook: Sway exited before its Wayland socket was ready" >&2
                  exit 1
                fi
                storybook_sway_attempts=$((storybook_sway_attempts + 1))
                if [ "$storybook_sway_attempts" -ge 100 ]; then
                  if [ -f "$storybook_sway_log" ]; then
                    cat "$storybook_sway_log" >&2
                  fi
                  echo "gpui-storybook: Sway did not become ready" >&2
                  exit 1
                fi
                sleep 0.05
              done
              export WAYLAND_DISPLAY="${storybook_wayland_socket##*/}"
              export LIBGL_ALWAYS_SOFTWARE=1
              "$@"
            ' sh \
              cargo run -p gpui-storybook-example-story --features mcp --locked
          test -s target/storybook-captures/ci-sway-button.png

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Lint code
        run: cargo clippy --workspace --all-features

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Check package contents
        run: cargo package --workspace --list

  machete:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Machete
        uses: bnjbvr/cargo-machete@main

  rust-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-llvm-cov
        shell: bash
        run: cargo binstall cargo-llvm-cov --locked --no-confirm

      - name: Run coverage
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --all-features --cobertura --output-path=target/cobertura.xml --exclude gpui-storybook-example-story --exclude gpui-storybook-example-component

      - name: Codecov publish
        uses: codecov/codecov-action@v7
        with:
          files: target/cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov housekeeping
        shell: bash
        run: |
          rm -f codecov codecov.SHA256SUM codecov.SHA256SUM.sig
