name: portable mobile automation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - name: Check portable device contracts
        run: cargo check -p gpui-storybook-automation -p gpui-storybook-mobile --target ${{ matrix.target }} --locked
